name: Docker Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        if: runner.arch == 'ARM64'
      - name: Build and start the lab
        run: docker compose -f docker/docker-compose.yml up --build -d
      - name: Run smoke test
        run: bash docker/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
