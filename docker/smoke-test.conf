# Settings for docker/smoke-test.sh.

SIM_NAME="Aloha Water Treatment"

# Compose profiles to start along with the default services.
PROFILES="bacnet"

# Fact source shipped in docs/sources/. SOURCE_FACTS are copied from it. The
# smoke test runs one read per protocol, so it reads the Modbus connection
# facts (including the lab-injected IP) from the Modbus reconnaissance source;
# the BACnet target carries its own facts below.
FACTS_ID="b3724036-b595-486a-897d-ea85da87e9f3"

# One target per protocol. Each runs ABILITY (its exact Caldera name) against
# the PLC in compose service SERVICE, with SOURCE_FACTS copied from the fact
# source and FACTS (trait=value) added. PORT is the PLC's TCP port, probed from
# the host (empty for UDP). The read worked if its output matches EXPECT.
TARGETS="modbus bacnet"

target_modbus() {
    SERVICE="plc"
    PORT="5020"
    ABILITY="Modbus - Read Holding Registers"
    SOURCE_FACTS="modbus.server.ip modbus.server.port modbus.read_holding.start modbus.read_holding.count"
    FACTS=""
    EXPECT="holding register [0-9]+ = [0-9]+"
}

target_bacnet() {
    SERVICE="bacnet-plc"
    PORT=""
    ABILITY="BACnet Read Property"
    SOURCE_FACTS=""
    FACTS="bacnet.device.instance=1001 bacnet.obj.type=analog-value bacnet.obj.instance=1 bacnet.obj.property=present-value bacnet.read.index=-1"
    EXPECT="[0-9]"
}
